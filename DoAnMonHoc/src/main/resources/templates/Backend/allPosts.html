<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trường Đại học Nha Trang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/css/Backend/style.css">
  <link rel="stylesheet" href="/css/Frontend/style.css">
</head>
<body>
  <h1>Posts</h1>
  <a href="/addpost" class="addps">Add Post</a>
  <br>
  <a href="#">All</a>
  <a href="#">Published</a>
  <a href="#">Draft</a>
  <a href="#">Private</a>
  <a href="#">Trash</a>
  <br>
  <div class="container">
    <div class="row">
      <div class="col-md-4 mb-4" th:each="post : ${posts}">
        <a th:href="${post.link}" th:title="${post.tooltip}" target="_blank" class="card h-100 border-0 text-decoration-none text-dark">
          <img th:src="${post.image}" class="card-img-top news-img" alt="Tin nổi bật"
               style="height: 220px; object-fit: cover;">
          <div class="card-body">
            <h6 class="card-title fw-semibold" th:text="${post.title}"></h6>
            <p class="text-muted small" th:text="${post.timeAgo}"></p>
          </div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
